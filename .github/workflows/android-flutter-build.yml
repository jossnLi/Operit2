name: Android Flutter Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUST_TOOLCHAIN_VERSION: 1.95.0
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Install LLVM and lld for V8 build
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg lld unzip
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libclang-21-dev llvm-21-dev
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> $GITHUB_ENV
          echo "OPERIT_LIBCLANG_DIR=/usr/lib/llvm-21/lib" >> $GITHUB_ENV

      - name: Cache source-built Android V8
        id: v8-cache
        uses: actions/cache@v4
        with:
          path: tools/release/work/android-v8
          key: Linux-X64-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Build V8 for Android (aarch64)
        if: steps.v8-cache.outputs.cache-hit != 'true'
        run: |
          python tools/build_scripts/prepare_android_v8.py \
            --target aarch64-linux-android \
            --env-file tools/release/work/android-v8/v8.env

      - name: Upload Android V8 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-v8-${{ github.sha }}
          path: tools/release/work/android-v8
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: [build-android-runtime, build-android-v8]
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Download Android V8 artifacts
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-v8-${{ github.sha }}
          path: tools/release/work/android-v8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create repository virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack and install TypeScript
        shell: pwsh
        run: |
          corepack enable
          npm install -g typescript@5.9.3
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            apps/flutter/native/operit-flutter-bridge

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/flutter/app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Prepare bundled models.dev catalog
        shell: pwsh
        run: python tools/build_scripts/models_dev_bundle.py

      - name: Generate Dart proxy artifacts
        shell: pwsh
        run: |
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml --quiet
          $artifacts = @(
            "apps/flutter/app/lib/core/proxy/generated/CoreProxyClients.g.dart",
            "apps/flutter/app/lib/core/proxy/generated/CoreProxyModels.g.dart"
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Expected generated Dart proxy artifact is missing: $artifact"
            }
            if ((Get-Item -LiteralPath $artifact).Length -eq 0) {
              throw "Expected generated Dart proxy artifact is empty: $artifact"
            }
          }

      - name: Install Flutter dependencies
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test changed settings flows
        working-directory: apps/flutter/app
        shell: pwsh
        run: |
          fvm flutter test `
            test/settings_screen_layout_test.dart `
            test/settings_detail_transition_test.dart `
            test/model_provider_display_test.dart `
            test/model_settings_capability_refresh_test.dart `
            test/local_model_llm_settings_test.dart `
            test/tts_provider_section_test.dart `
            test/stt_provider_preset_test.dart `
            test/onboarding_snapshot_import_progress_test.dart `
            test/storage_directory_selection_test.dart `
            test/widget_test.dart

      - name: Cache Android bindgen libclang
        id: libclang-cache
        uses: actions/cache@v4
        with:
          path: target/operit-build-tools
          key: ${{ runner.os }}-libclang-21.1.8

      - name: Prepare Android bindgen libclang
        if: steps.libclang-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (Test-Path -LiteralPath $libclang) {
            Write-Host "Android bindgen libclang already exists at $libclang"
            return
          }
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Restore Android signing material
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          $signingProps = Join-Path $secretsDir "android-signing.properties"

          if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_RELEASE_KEYSTORE_BASE64) -and
              -not [string]::IsNullOrWhiteSpace($env:ANDROID_RELEASE_STORE_PASSWORD) -and
              -not [string]::IsNullOrWhiteSpace($env:ANDROID_RELEASE_KEY_ALIAS) -and
              -not [string]::IsNullOrWhiteSpace($env:ANDROID_RELEASE_KEY_PASSWORD)) {
            Write-Host "Using configured repository secrets for release signing."
            [System.IO.File]::WriteAllBytes($keystore, [System.Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64))
            @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=$env:ANDROID_RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$env:ANDROID_RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$env:ANDROID_RELEASE_KEY_PASSWORD
          "@ | Set-Content -Path $signingProps -Encoding utf8
          } else {
            Write-Host "No signing secrets provided. Generating automatic keystore for build..."
            keytool -genkeypair -v -keystore $keystore -alias operit -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Operit, OU=Operit, O=Operit, L=Operit, S=Operit, C=CN"
            @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=123456
          RELEASE_KEY_ALIAS=operit
          RELEASE_KEY_PASSWORD=123456
          "@ | Set-Content -Path $signingProps -Encoding utf8
          }

      - name: Build and package Android app
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value

      - name: Build and package Android module
        shell: pwsh
        run: python tools/build_scripts/build_android_module_release.py

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android module artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-module-${{ github.sha }}
          path: tools/release/dist/operit2-module-android-arm64-v8a-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
